<!DOCTYPE html>
<html lang="es">
<head>
    <title>Imagen transparente superpuesta</title>
<style>
.contenedor-principal {
  position: relative; /* Necesario para posicionar los elementos hijos de forma absoluta */
  width: 170px;
  height: 30px;
}



.imagen-transparente {
  position: absolute;
  top: 0%; /* Ajusta la posición vertical */
  left: 85%; /* Ajusta la posición horizontal */
  transform: translate(-20%, -10%); /* Centra la imagen */
  width: 150px;
  height: 350px;
  background-image: url('https://pr1merastereoradiofm.infy.uk/imagenes/4bg_site.png'); /* Tu imagen transparente (formato PNG es ideal) */
  background-size: contain;
  background-repeat: no-repeat;
  z-index: 2; /* Asegura que esta imagen esté encima de la otra */
}
</style>
</head>
<body>

<div class="contenedor-principal">
  <div class="imagen-fondo"></div>
  <div class="imagen-transparente">
    <style> 
	
   body {
  background-color: #000000; /* O el nombre del color como "lightblue" */
}
   	</style>
</div>
</div>

</body>   
    
    
<style>
        html,
        body {
            font-family: "Open Sans", sans-serif;
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: #000000;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0e60b8">
    <title>PRIMERA STEREO 90.9 FM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        /* Estilos Base y Fondo (similares a Luna Radio) */
        body {
            margin: 0; 
            padding: 0; 
            background: #000 url('http://primerastereoradio.free.nf/favicon.png') center center / cover no-repeat fixed; 
            overflow-x: hidden;
            color: #ffffff;
            font-family: 'Open Sans', sans-serif;
        }
        #radio-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7); 
            text-align: center;
        }
        #player-box {
            /* Estilo para simular el reproductor grande de Luna Radio */
            background-color: rgba(0, 0, 0, 0.8);
            padding: 40px 20px;
            border-radius: 10px;
            max-width: 90%;
            width: 450px;
            border-top: 3px solid #0e60b8; /* Borde superior de color */
        }

        /* Área de Metadatos */
        #artwork {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            margin: 0 auto 20px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: background-image 0.5s ease-in-out;
            border: 1px solid #333;
        }
        #station-info {
            font-size: 1.2em;
            font-weight: 300;
            color: #888;
            margin-bottom: 10px;
        }
        #song-title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            line-height: 1.2;
        }
        #artist-name {
            font-size: 1.3em;
            font-weight: 400;
            color: #0e60b8; /* Color destacado para el artista */
            margin-bottom: 20px;
        }

        /* Controles (Play/Pause y Volumen) */
        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }
        #play-pause-btn {
            background-color: #0e60b8;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: background-color 0.2s;
        }
        #play-pause-btn:hover {
            background-color: #0c4a92;
        }
        
        /* Control de Volumen */
        #volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #volume-control i {
            font-size: 1.2em;
            color: #0e60b8;
        }
        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 8px;
            background: #555;
            outline: none;
            opacity: 0.8;
            transition: opacity .15s;
            border-radius: 4px;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0e60b8;
            cursor: pointer;
        }
        #volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0e60b8;
            cursor: pointer;
        }
    </style>
</head>

<body>
<p style="color: blue;">Este texto será azul.</p>
    <div id="radio-player-container">
        <div id="player-box">
            <div id="artwork" style="background-image: url('http://primerastereoradio.free.nf/favicon.png');"></div>
          
            <div id="station-info"><strong><p style="color: #0476e0;">PRIMERA STEREO<p style="color: #fc8200;">Radio Online</p></strong></div>
            <div id="song-title">Cargando Título...</div>
            <div id="artist-name">Cargando Artista...</div>
            <audio id="stream-audio" preload="auto">
                <source src="https://primerastereo.stream.laut.fm/primerastereo" type="audio/aac">
                Tu navegador no soporta el elemento de audio.
            </audio>

            <div id="controls">
                <button id="play-pause-btn" aria-label="Reproducir"><i class="fas fa-play"></i></button>

                <div id="volume-control">
                    <i id="volume-icon" class="fas fa-volume-up"></i>
                    <input type="range" id="volume-slider" min="0" max="100" value="100">
                </div>
            </div>
        </div>
    </div>

    <script src="https://primerastereo2025.netlify.app/jquery-3.3.1.min.js"></script>
    <script>
        const API_URL = "https://api.laut.fm/station/primerastereo/current_song";
        const AUDIO_ELEMENT = document.getElementById('stream-audio');
        const PLAY_PAUSE_BTN = document.getElementById('play-pause-btn');
        const VOLUME_SLIDER = document.getElementById('volume-slider');
        const VOLUME_ICON = document.getElementById('volume-icon');
        const ARTWORK_DIV = document.getElementById('artwork');
        const SONG_TITLE_DIV = document.getElementById('song-title');
        const ARTIST_NAME_DIV = document.getElementById('artist-name');
        const FALLBACK_ARTWORK = 'http://primerastereoradio.free.nf/favicon.png';

        let lastMetadata = "";

        // --- Funciones de Audio ---
        function updateVolumeIcon(volume) {
            if (volume === 0) {
                VOLUME_ICON.className = 'fas fa-volume-mute';
            } else if (volume < 50) {
                VOLUME_ICON.className = 'fas fa-volume-down';
            } else {
                VOLUME_ICON.className = 'fas fa-volume-up';
            }
        }

        function setInitialVolume() {
            // Establecer volumen inicial del audio y del slider al 100%
            AUDIO_ELEMENT.volume = 1.0;
            VOLUME_SLIDER.value = 100;
            updateVolumeIcon(100);
        }

        function togglePlayPause() {
            if (AUDIO_ELEMENT.paused) {
                AUDIO_ELEMENT.play().then(() => {
                    PLAY_PAUSE_BTN.innerHTML = '<i class="fas fa-pause"></i>';
                    PLAY_PAUSE_BTN.setAttribute('aria-label', 'Pausar');
                }).catch(error => {
                    console.error("Autoplay bloqueado:", error);
                    // Opcional: Mostrar un mensaje si el navegador bloquea el autoplay
                });
            } else {
                AUDIO_ELEMENT.pause();
                PLAY_PAUSE_BTN.innerHTML = '<i class="fas fa-play"></i>';
                PLAY_PAUSE_BTN.setAttribute('aria-label', 'Reproducir');
            }
        }
        
        // --- Funciones de Metadatos ---
        function fetchCoverArt(artist, title, callback) {
            const searchTerm = encodeURIComponent(`${artist} ${title}`);
            const itunesApi = `https://itunes.apple.com/search?term=${searchTerm}&media=music&entity=song&limit=1`;
            
            $.getJSON(itunesApi, (data) => {
                if (data.resultCount > 0) {
                    const artworkUrl = data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
                    callback(artworkUrl);
                } else {
                    callback(FALLBACK_ARTWORK);
                }
            }).fail(() => {
                callback(FALLBACK_ARTWORK);
            });
        }

        function updateMetadata() {
            $.getJSON(API_URL, (data) => {
                if (data && data.title && data.artist && data.artist.name) {
                    const title = data.title;
                    const artistName = data.artist.name; 
                    const newMetadata = `${artistName} - ${title}`;

                    if (newMetadata !== lastMetadata) {
                        lastMetadata = newMetadata;
                        
                        // Actualizar texto
                        SONG_TITLE_DIV.textContent = title;
                        ARTIST_NAME_DIV.textContent = artistName;
                        document.title = newMetadata + " | PRIMERA STEREO";

                        // Actualizar carátula
                        fetchCoverArt(artistName, title, (artworkUrl) => {
                            ARTWORK_DIV.style.backgroundImage = `url('${artworkUrl}')`;
                        });
                        
                        console.log(`[Custom Player] Metadata Actualizada: ${newMetadata}`);
                    }
                }
            }).fail(() => {
                // Mensaje de error si la API falla
                SONG_TITLE_DIV.textContent = "Error de conexión";
                ARTIST_NAME_DIV.textContent = "Reintentando...";
            });
        }

        // --- Inicialización y Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            setInitialVolume();

            PLAY_PAUSE_BTN.addEventListener('click', togglePlayPause);

            VOLUME_SLIDER.addEventListener('input', (event) => {
                // Convierte el valor del slider (0-100) a volumen del audio (0.0 - 1.0)
                const newVolume = event.target.value / 100;
                AUDIO_ELEMENT.volume = newVolume;
                updateVolumeIcon(parseInt(event.target.value));
            });

            // Intentar iniciar el audio al cargar (si el navegador lo permite)
            AUDIO_ELEMENT.play().catch(error => {
                console.warn("Reproducción pausada inicialmente, requiere interacción del usuario.");
                PLAY_PAUSE_BTN.innerHTML = '<i class="fas fa-play"></i>';
                PLAY_PAUSE_BTN.setAttribute('aria-label', 'Reproducir');
            });

            // Iniciar la actualización de metadatos (y luego repetirla cada 8 segundos)
            updateMetadata();
            setInterval(updateMetadata, 8000); 
        });
    </script>
    
</body>
</html>
